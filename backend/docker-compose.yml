# Infrastructure locale de DÉVELOPPEMENT uniquement (D-022, D-024).
# Identifiants factices, ports exposés sur localhost seulement. Ne pas utiliser en production.
#
#   docker compose up -d
#   DATABASE_URL=postgres://le_ter:le_ter@localhost:5433/le_ter
#   REDIS_URL=redis://localhost:6379
#   npm run db:migrate

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: le_ter
      POSTGRES_PASSWORD: le_ter
      POSTGRES_DB: le_ter
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U le_ter -d le_ter']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # Pas de persistance : Redis n'est jamais la source de vérité.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Assistant des réclamations (D-114) : Ollama, FACULTATIF (profil `ai`) :
  #   docker compose --profile ai up -d ollama
  #   docker compose exec ollama ollama pull qwen2.5:1.5b
  # Port publié sur 127.0.0.1 SEULEMENT (jamais sur une interface publique). Un backend placé
  # dans ce réseau Docker utilise http://ollama:11434 ; le port publié peut alors être retiré.
  # Mémoire bornée : le modèle par défaut tient en ~2 Go sur CPU.
  ollama:
    image: ollama/ollama
    profiles: ['ai']
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - ollama-models:/root/.ollama
    mem_limit: 4g

volumes:
  postgres-data:
  ollama-models:
